services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword123}
      # The SQL files hard-code `USE pr_approval`, so keep this name.
      MYSQL_DATABASE: pr_approval
      MYSQL_USER: ${DB_USER:-pr_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-devpassword123}
      TZ: Asia/Bangkok
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - ./backend/database:/sql:ro
      - ./backend/docker/initdb.sh:/docker-entrypoint-initdb.d/initdb.sh:ro
      - db_data:/var/lib/mysql
    healthcheck:
      # TCP ping fails while the entrypoint's init-only server (no networking) runs.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-pr_app}
      DB_PASSWORD: ${DB_PASSWORD:-devpassword123}
      DB_NAME: pr_approval
      JWT_SECRET: ${JWT_SECRET:-change_me}
      TZ: Asia/Bangkok
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  db_data:
  uploads:
